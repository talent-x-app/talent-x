# Veille TGV Max Jeune Paris <> Nancy — voir README.md
# NB : les crons GitHub sont "best effort" — un pas de 15 min tourne en
# pratique toutes les 15 à 30 min selon la charge de la plateforme.
name: maxwatch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : affiche le résultat, n'envoie rien, ne modifie pas state.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maxwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer requests
        run: pip install --quiet requests

      - name: Lancer la veille
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python maxwatch.py --dry-run
          else
            python maxwatch.py
          fi

      - name: Committer state.json s'il a changé
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "maxwatch-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: mise à jour de l'état des dispos"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "state.json inchangé, rien à committer"
          fi
