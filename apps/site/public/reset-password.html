<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Le jeton de réinitialisation transite dans l'URL : on interdit tout référent
         sortant, et on demande aux moteurs de ne pas indexer la page (ADR-57). -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nouveau mot de passe · Talent-X</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <main>
      <p class="brand">Talent-<span>X</span></p>

      <h1>Nouveau mot de passe</h1>
      <p class="lead" data-testid="lead">
        Choisis un nouveau mot de passe pour ton compte. Il te servira à te reconnecter dans
        l'application.
      </p>

      <form data-testid="reset-form" novalidate>
        <label for="password">Nouveau mot de passe</label>
        <input
          id="password"
          data-testid="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <label for="confirm">Confirme le mot de passe</label>
        <input
          id="confirm"
          data-testid="confirm"
          type="password"
          autocomplete="new-password"
          required
        />

        <button type="submit" data-testid="submit">Changer mon mot de passe</button>
      </form>

      <p class="message" data-testid="message" role="status" hidden></p>
    </main>

    <!-- Injecté par le serveur (bloc Nginx du site, ou scripts/serve.mjs en local) :
         l'URL de l'API n'est jamais en dur dans les fichiers versionnés. -->
    <script src="/assets/config.js"></script>
    <script type="module" src="/assets/reset-password.js"></script>
  </body>
</html>
